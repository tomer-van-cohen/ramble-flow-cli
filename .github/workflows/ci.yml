name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          swift --version
      - name: Repository hygiene
        run: ./scripts/check-repo.sh
      - name: Release build of the program
        run: swift build -c release --product ramble-flow
      - name: Tests (synthetic audio, mock HTTP; no network calls to providers)
        run: ./scripts/test.sh

  # The end-to-end test loads a LaunchAgent into the runner's GUI session (temporary HOME, unique
  # .test label, loopback mock provider). Hosted runners have not been verified to provide that
  # session, so this job does not block merges.
  end-to-end:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: End-to-end (installer + background process, mock provider)
        run: ./scripts/e2e.sh
